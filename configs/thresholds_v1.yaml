version: "1.2.0"
registers:
  T-ESC:
    frozen_at_gate: G2
    escape_sample_per_item: 12
    min_sample_for_validity: 8
    rule: "any hit in the excluded sample -> status=flag_widen_filter; zero hits -> status=pass_low_power (UB at n=12 cannot prove <5%); n<8 -> insufficient_power"
    consequence: "flag_widen_filter blocks the item's findings until the prefilter is widened and re-run"
    owner: PO
  T-AGR:
    frozen_at_gate: G2
    agreement_sample_interactions: 6
    min_sample_for_validity: 5
    per_field_floor: 0.85
    rule: "per-field agreement < floor -> field unstable; n<5 -> insufficient_power"
    consequence: "unstable fields flagged in run log; findings leaning on them carry a visible instability marker"
    owner: PO
  T-DROP:
    frozen_at_gate: G2
    rate_alarm: 0.02
    rule: "denominator = candidate claims (quotes+stats submitted to gate); any quote string-match failure is a fabricated-evidence drop -> status=release_block; rate > alarm -> status=warn_investigate"
    consequence: "release_block stops report publication for the run"
    owner: PO
  T-SPLIT:
    frozen_at_gate: G2
    min_corpus_interactions: 20
    rule: "seeded half-split of interactions; per unit, compare item rank orders from persisted hits; a top-2 rank flip -> item status=demote; corpus < min -> insufficient_power"
    consequence: "demoted items are excluded from Highlights and marked in the distribution"
    owner: PO
  T-PARA:
    frozen_at_gate: G3
    sample_top_items: 2
    sample_rare_items: 2
    rare_max_count: 2
    judgments_per_item: 6
    min_sample_for_validity: 4
    disagreement_floor: 0.2
    rule: "risk-stratified item sample (top-count + rare); per sampled hit, paired re-judgment of identical interaction evidence under original vs paraphrased criterion; per-item disagreement rate > 0.20 -> status=not_a_measurement; n<4 -> insufficient_power"
    consequence: "not_a_measurement items keep raw counts visible but are excluded from grid tie-breaks and Highlights, marked in the distribution"
    owner: PO
  T-CAL:
    frozen_at_gate: G3
    relative_error_max: 0.25
    absolute_error_max: 2
    mechanism_attribution_floor: 0.8
    derivation: "a count off by more than a quarter flips leverage-grid tiers and rank order at hundreds-scale — the decision surface; the absolute term protects small planted counts where relative error is noise; conjunctive so neither term alone fails a pathology. Camouflaged plants yield a sensitivity row, never a gate (D 7.3: curve, not pass/fail)."
    rule: "per pathology, loud+moderate plants pooled: relative count error > 0.25 AND absolute error > 2 -> fail; of planted interactions with any target-item hit, mapped-item attribution < 0.80 -> mechanism_fail; camouflaged detection reported separately, ungated"
    consequence: "holdout fail after the T-ITER budget = abandon-trigger-1 input (PRD 8)"
    owner: PO
  T-NULL:
    frozen_at_gate: G3
    false_reports_per_100_max: 4
    min_null_interactions: 40
    rule: "false report = any planted-pathology item hit on a held-out null interaction; rate per 100 > 4 -> fail; n < 40 -> insufficient_power. The empirical noise floor is reported alongside, never the gate (absolute pre-registered floor, PRD 6)."
    consequence: "fail = abandon-trigger-1 input"
    owner: PO
  T-ITER:
    frozen_at_gate: G3
    max_dev_cycles: 3
    holdout_evaluations: 1
    rule: "dev/holdout split per A7; revisions see dev only; every dev scoring appends cycles.json (register history); exactly one predeclared holdout evaluation, enforced by a one-shot marker; budget exhausted + holdout failing -> abandon trigger 1 fires"
    consequence: "PO owns the stop/continue decision; the cycle log is the audit trail"
    owner: PO
  T-SST:
    frozen_at_gate: G4
    sample_fraction: 0.10
    seeds: [11, 22, 33, 44, 55]
    min_evaluable_interactions: 40
    material_seed_fraction: 0.4
    topk: 3
    layers_gated: [distribution, rank_topk, highlight_diff, band_movement]
    distribution_tv_max: 0.25
    derivation: "the four §7 layers each capture a decision-relevant way corpus access could change the output: distribution distance (magnitude of distributional shift, TV > 0.25), top-k rank (leverage-grid ordering), highlighted-action set membership, and opportunity-band movement (priced ranking). A seed counts as material if ANY layer differs; a difference on >= 40% of predeclared seeds is a material advantage (§7.6 fraction-of-seeds). Below 40 evaluable interactions the comparison is underpowered -> not-evaluable. band_movement is compared only when a catalogue is loaded (the real run has one)."
    rule: "per §7: freeze eligibility/rubric/catalogue/thresholds/metrics; for each seed draw a 10% sample, regenerate from sample records only; compare all four layers (distribution TV, top-k rank, highlight-set membership, priced-ranking top-k); a seed is material if any layer differs; state = material-advantage if the material-seed fraction >= 0.40, else no-material-advantage; n < 40 -> not-evaluable"
    consequence: "governs R-VAL-5 states; no-material-advantage on an evaluable real run = abandon-trigger-2 input (§8)"
    owner: PO
  T-DIFF:
    frozen_at_gate: G4
    tolerance: 0.20
    variants: 3
    derivation: "a differential reading that misses its injected delta by more than a fifth cannot be trusted to track magnitude on real language; conjunction with per-variant predeclared deltas isolates which perturbation failed. Three variants (delete/duplicate/splice) exercise removal, chain growth, and additive signal."
    rule: "per variant, predeclared expected delta vs instrument reading: relative error > 0.20 -> fail; any variant fail = abandon-trigger-1 input (magnitude invalid on real language, §8)"
    consequence: "breach after construction on the real corpus = abandon-trigger-1 input (§8)"
    owner: PO
