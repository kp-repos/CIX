[project]
name = "cix"
version = "0.1.0"
description = "CIX customer intelligence module — deterministic spine"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "fpdf2>=2.8.7",
    "openai>=1.60",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]

[project.scripts]
cix = "cix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
