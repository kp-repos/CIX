[project]
name = "cix"
version = "0.1.0"
description = "CIX customer intelligence module — deterministic spine"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
cix = "cix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
